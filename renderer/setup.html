<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Swing Music</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #050505;
      color: #f5f5f5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.11), transparent 32rem),
        linear-gradient(180deg, #111 0%, #050505 42%, #000 100%);
    }

    main {
      width: min(440px, calc(100vw - 40px));
      display: grid;
      gap: 28px;
    }

    .brand {
      display: grid;
      justify-items: center;
      gap: 18px;
      text-align: center;
    }

    .logo-frame {
      width: 88px;
      height: 88px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 22px;
      background: linear-gradient(180deg, #fff 0%, #f4f4f4 100%);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
    }

    img {
      width: 62px;
      height: 62px;
      object-fit: contain;
    }

    h1 {
      margin: 0;
      font-size: 34px;
      font-weight: 650;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: #a9a9a9;
      line-height: 1.5;
    }

    form {
      display: grid;
      gap: 14px;
    }

    label {
      display: grid;
      gap: 10px;
      color: #d7d7d7;
      font-size: 13px;
      font-weight: 600;
    }

    input {
      width: 100%;
      height: 54px;
      padding: 0 16px;
      border: 1px solid #2b2b2b;
      border-radius: 8px;
      outline: none;
      background: #0c0c0c;
      color: #f5f5f5;
      font-size: 15px;
      transition: border-color 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }

    input::placeholder {
      color: #626262;
    }

    input:focus {
      border-color: #f1f1f1;
      background: #111;
      box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.08);
    }

    button {
      height: 52px;
      border: 0;
      border-radius: 8px;
      background: #f5f5f5;
      color: #050505;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
      transition: transform 140ms ease, background 140ms ease, opacity 140ms ease;
    }

    button:hover {
      background: #fff;
      transform: translateY(-1px);
    }

    button:disabled {
      cursor: default;
      opacity: 0.65;
      transform: none;
    }

    #error {
      min-height: 22px;
      color: #ff8f8f;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main>
    <section class="brand" aria-label="Swing Music">
      <div class="logo-frame">
        <img src="../assets/swingmusiclogo.png" alt="" />
      </div>
      <div>
        <h1>Swing Music</h1>
        <p>Connect to your self-hosted web panel.</p>
      </div>
    </section>

    <form id="server-form">
      <label for="url">
        Server URL
        <input id="url" name="url" type="text" autocomplete="url" placeholder="192.168.1.10:1970" />
      </label>
      <button id="connect" type="submit">Connect</button>
      <p id="error" role="status" aria-live="polite"></p>
    </form>
  </main>

  <script src="renderer.js"></script>
</body>
</html>
